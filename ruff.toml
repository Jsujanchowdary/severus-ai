[lint]
select = ["E", "F", "W", "I", "N"]
ignore = ["E501", "E402", "E722"]  # Line too long, imports not at top (intentional), bare except
# Only check project Python files in root directory
exclude = [
    "venv",
    ".git",
    "__pycache__",
    "*.egg-info",
    ".ruff_cache",
    "config",
    "documentation",
    "helm",
    "k8s",
    "stress-pod",
    "utils",
    "data",
]

[format]
quote-style = "double"
indent-style = "space"
