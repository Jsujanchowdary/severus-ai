# ------------------------
# Application Image
# ------------------------
image:
  repository: sujanchow/serverus-ai
  tag: v1
  pullPolicy: Always

# ------------------------
# Application Resources
# ------------------------
resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

# ------------------------
# Service Configuration
# ------------------------
service:
  type: ClusterIP
  port: 8501

# ------------------------
# Ingress Configuration
# ------------------------
ingress:
  enabled: true
  className: traefik
  hosts:
    - host: severus-ai.local
      paths:
        - path: /
          pathType: Prefix

# ------------------------
# Ollama Configuration
# ------------------------
ollama:
  baseUrl: http://host.docker.internal:11434

# ------------------------
# HPA Configuration
# ------------------------
hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  cpu:
    averageUtilization: 50

# ------------------------
# Stress Testing
# ------------------------
stress:
  enabled: true
  image:
    repository: sujanchow/stress-pod
    tag: "latest"
  
  args:
    # Target URL for stress testing
    # Port 8501: HTTPS with mTLS validation (nginx sidecar)
    # Port 8080: Plain HTTP (browser access)
    targets:
      - https://severus-ai:8501
    
    # Load parameters - Increased for HPA scaling demo
    totalRequests: 2000
    concurrency: 150
    runs: 10
    sleepSeconds: 2
    
    # Pod labels to validate
    podLabels:
      - app=severus-ai

# ------------------------
# RBAC
# ------------------------
rbac:
  create: true
  serviceAccountName: stress-sa

# ------------------------
# Certificates (mTLS)
# ------------------------
certificates:
  enabled: true
  issuer: severus-ai-ca-issuer
  
  serverCert:
    secretName: severus-ai-tls
    dnsNames:
      - severus-ai
      - severus-ai.default.svc.cluster.local
  
  clientCert:
    secretName: stress-pod-tls
  
  nginx:
    image: nginx:1.25-alpine
    # on: require valid client certificate (strict)
    # optional: allow requests without cert but log them (permissive)
    verifyClient: optional
  
  verification:
    # strict: reject requests without valid certificate
    # permissive: allow requests without certificate (log only)
    enforceMode: permissive

# ------------------------
# Monitoring & Observability
# ------------------------
monitoring:
  enabled: true
  scrapeInterval: 30s
  metricsPort: 8000
  serviceMonitor:
    enabled: true  # Prometheus Operator is installed