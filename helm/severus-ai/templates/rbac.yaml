{{- if .Values.rbac.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.rbac.serviceAccountName }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader
rules:
# Allow viewing pods
- apiGroups: [""]
  resources:
    - pods
  verbs:
    - get
    - list
    - watch

# Allow reading pod logs
- apiGroups: [""]
  resources:
    - pods/log
  verbs:
    - get

# Allow kubectl exec
- apiGroups: [""]
  resources:
    - pods/exec
  verbs:
    - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: stress-binding
subjects:
- kind: ServiceAccount
  name: {{ .Values.rbac.serviceAccountName }}
roleRef:
  kind: Role
  name: pod-reader
  apiGroup: rbac.authorization.k8s.io
{{- end }}
