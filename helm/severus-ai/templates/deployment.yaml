apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "severus-ai.fullname" . }}
spec:
  selector:
    matchLabels:
      app: severus-ai
  template:
    metadata:
      labels:
        app: severus-ai
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
{{- if .Values.certificates.enabled }}
        # nginx sidecar for mTLS validation
        - name: nginx
          image: {{ .Values.certificates.nginx.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: https-mtls
              containerPort: 8501
              protocol: TCP
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: tls-certs
              mountPath: /etc/certs
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
{{- end }}
        - name: severus-ai
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: streamlit
              containerPort: 8502
              protocol: TCP
            - name: metrics
              containerPort: 8000
              protocol: TCP
          env:
            - name: OLLAMA_BASE_URL
              value: {{ .Values.ollama.baseUrl }}
            - name: prometheus_multiproc_dir
              value: /app/data/metrics
            - name: PROMETHEUS_MULTIPROC_DIR
              value: /app/data/metrics
            - name: STREAMLIT_SERVER_PORT
              value: "8502"
{{- if .Values.certificates.enabled }}
            - name: CERT_ENFORCE_MODE
              value: {{ .Values.certificates.verification.enforceMode }}
            - name: TLS_CERT_PATH
              value: /etc/certs/tls.crt
            - name: TLS_KEY_PATH
              value: /etc/certs/tls.key
            - name: CA_BUNDLE_PATH
              value: /etc/certs/ca.crt
{{- end }}
          livenessProbe:
            httpGet:
              path: /
              port: 8501
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: 8501
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
            limits:
              cpu: {{ .Values.resources.limits.cpu }}
              memory: {{ .Values.resources.limits.memory }}
          volumeMounts:
            - name: app-data
              mountPath: /app/data
{{- end }}
        
        # Metrics exporter sidecar
        - name: metrics-exporter
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "🚀 Starting metrics exporter..."
              cd /app
              python3 metrics_exporter.py
          env:
            - name: prometheus_multiproc_dir
              value: /app/data/metrics
            - name: PROMETHEUS_MULTIPROC_DIR
              value: /app/data/metrics
          ports:
            - name: metrics
              containerPort: 8000
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: app-data
              mountPath: /app/data
      
      volumes:
        - name: app-data
          emptyDir: {}
{{- if .Values.certificates.enabled }}
        - name: nginx-config
          configMap:
            name: {{ include "severus-ai.fullname" . }}-nginx-config
        - name: tls-certs
          secret:
            secretName: {{ .Values.certificates.serverCert.secretName }}
{{- end }}
