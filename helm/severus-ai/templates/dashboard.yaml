apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "severus-ai.fullname" . }}-dashboard
  labels:
    {{- include "severus-ai.labels" . | nindent 4 }}
    grafana_dashboard: "1"
  {{- if .Values.commonAnnotations }}
  annotations:
    {{- toYaml .Values.commonAnnotations | nindent 4 }}
  {{- end }}
data:
  severus-ai-dashboard.json: |-
{{ .Files.Get "dashboards/application.json" | indent 4 }}
