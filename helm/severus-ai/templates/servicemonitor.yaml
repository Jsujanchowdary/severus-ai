{{- if and .Values.monitoring.enabled .Values.monitoring.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "severus-ai.fullname" . }}
  labels:
    app: severus-ai
    release: {{ .Values.monitoring.serviceMonitor.release | default "kube-prometheus-stack" }}
spec:
  selector:
    matchLabels:
      app: severus-ai
  endpoints:
    - port: metrics
      interval: {{ .Values.monitoring.scrapeInterval }}
      path: /metrics
{{- end }}
